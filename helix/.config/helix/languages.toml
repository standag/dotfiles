[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ty]
command = "ty"
args = ["server"]

[language-server.ruff-lsp]
command = "ruff"
args = ["server"]

[language-server.tailwindcss-lsp]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.typescript-lsp]
command = "typescript-language-server"
args = ["--stdio"]

[language-server.yaml-language-server]
Config = { yaml = { keyOrdering = false, format = { enable = true } } }

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.eslint.config]
codeActionsOnSave = { mode = "all", "source.fixAll.eslint" = true }
format = { enable = true }
nodePath = ""
quiet = false
rulesCustomizations = []
run = "onType"
validate = "on"
experimental = {}
problems = { shortenToSingleLine = false }

[language-server.eslint.config.codeAction]
disableRuleComment = { enable = true, location = "separateLine" }
showDocumentation = { enable = false }

[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

[[language]]
name = "typescript"
formatter = { command = 'dprint', args = ["fmt", "--stdin", "typescript"] }
auto-format = true

[[language]]
name = "tsx"
formatter = { command = 'dprint', args = ["fmt", "--stdin", "tsx"] }
auto-format = true
language-servers = ["typescript-lsp", "tailwindcss-lsp"]

[[language]]
name = "css"
formatter = { command = 'prettier', args = ["--stdin-filepath", "file.tsx"] }
auto-format = true
language-servers = ["tailwindcss-lsp"]

[[language]]
name = "javascript"
formatter = { command = 'dprint', args = ["fmt", "--stdin", "javascript"] }
auto-format = true

[[language]]
name = "python"
roots = ["pyproject.toml"]
language-servers = ["ty", "ruff-lsp"]
auto-format = true

[[language]]
name = "yaml"
file-types = ["yaml", "yml"]
auto-format = true
indent = { unit = " ", tab-width = 2 }
language-servers = ["yaml-language-server"]

[[language]]
name = "toml"
language-servers = ["taplo"]
